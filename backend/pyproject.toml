[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "factos-backend"
version = "0.1.0"
description = "Document-grounded answer comparison and bounded verification"
requires-python = ">=3.12"
dependencies = [
 "fastapi==0.142.1", "uvicorn==0.54.0", "pydantic-settings==2.15.0",
 "email-validator==2.3.0", "argon2-cffi==25.1.0", "python-multipart==0.0.32",
 "numpy==2.5.3", "faiss-cpu==1.15.1", "google-genai==2.25.0",
 "openai==3.22.1", "tiktoken==0.14.0", "httpx==0.28.1", "pillow==12.3.0",
 "langchain-community==0.4.2", "langchain-core==1.6.6",
 "unstructured==0.27.10", "pypdf==6.19.0", "python-docx==1.2.0",
 "python-pptx==1.0.2", "markdown-it-py==4.2.0", "markdown==3.11",
 "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85"
]
[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.9"]
[tool.setuptools.packages.find]
include = ["factos*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
